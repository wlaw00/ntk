<header class="header">
  <div class="logo-container">
    <a href="{{ '/' | relative_url }}" style="color: inherit; text-decoration: none; display: flex; align-items: center;">
      <!-- Zorg dat je een logo.png in assets/images/ hebt, anders wordt tekst getoond -->
      <span>NTK</span>
    </a>
  </div>

  <nav>
    <div class="nav-links">
      {% for item in site.navigation %}
        <a href="{{ item.url | relative_url }}" class="{% if page.url == item.url %}active{% endif %}">
          {{ item.title }}
        </a>
      {% endfor %}
    </div>
    
    <div class="burger">
      <div class="line1"></div>
      <div class="line2"></div>
      <div class="line3"></div>
    </div>
  </nav>
</header>
