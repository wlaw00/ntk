<!DOCTYPE html>
<html lang="nl">

  {% include head.html %}

  <body>

    {% include nav.html %}

    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {% if page.url == "/" %}
          <!-- Hero sectie alleen op homepagina -->
          <div class="hero">
            <h1>{{ site.title }}</h1>
            <p>{{ site.description }}</p>
            <a href="{{ '/about/' | relative_url }}" class="cta-button">Ontdek meer</a>
          </div>
        {% else %}
          <h1>{{ page.title }}</h1>
        {% endif %}

        {{ content }}
      </div>
    </main>

    {% include footer.html %}

    <script>
      // Eenvoudig script voor het mobiele menu
      const burger = document.querySelector('.burger');
      const nav = document.querySelector('.nav-links');
      
      burger.addEventListener('click', () => {
        nav.classList.toggle('nav-active');
        burger.classList.toggle('toggle');
      });
    </script>
  </body>

</html>
